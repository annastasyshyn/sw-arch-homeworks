services:
  facade-service:
    build:
      context: .
      dockerfile: facade/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOGGING_URLS=http://logging-service-1:8000,http://logging-service-2:8000,http://logging-service-3:8000
      - COUNTER_URL=http://counter-service:8000
    depends_on:
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started
      counter-service:
        condition: service_healthy

  logging-service-1:
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      - LOGGING_INSTANCE_ID=logging-1
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3

  logging-service-2:
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      - LOGGING_INSTANCE_ID=logging-2
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3

  logging-service-3:
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      - LOGGING_INSTANCE_ID=logging-3
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3

  hazelcast-1:
    image: hazelcast/hazelcast:5.6.0
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HAZELCAST_CONFIG=config/hazelcast.yaml
    expose:
      - "5701"

  hazelcast-2:
    image: hazelcast/hazelcast:5.6.0
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HAZELCAST_CONFIG=config/hazelcast.yaml
    expose:
      - "5701"

  hazelcast-3:
    image: hazelcast/hazelcast:5.6.0
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HAZELCAST_CONFIG=config/hazelcast.yaml
    expose:
      - "5701"

  counter-service:
    build:
      context: .
      dockerfile: counter/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
