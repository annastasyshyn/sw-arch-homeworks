services:
  config-server:
    build:
      context: .
      dockerfile: config_server/Dockerfile
    ports:
      - "8888:8888"

  facade-service:
    build:
      context: .
      dockerfile: facade/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - LOGGING_SERVICE_NAME=logging-service
      - COUNTER_SERVICE_NAME=counter-service
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
      - HZ_QUEUE_NAME=counter-updates
      - COUNTER_HTTP_TIMEOUT=3.0
    depends_on:
      config-server:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
      logging-service-1:
        condition: service_started
      logging-service-2:
        condition: service_started
      logging-service-3:
        condition: service_started
      counter-service:
        condition: service_healthy

  logging-service-1:
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      - LOGGING_INSTANCE_ID=logging-1
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
      - CONFIG_SERVER_URL=http://config-server:8888
      - SERVICE_NAME=logging-service
      - SERVICE_BASE_URL=http://logging-service-1:8000
    depends_on:
      config-server:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  logging-service-2:
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      - LOGGING_INSTANCE_ID=logging-2
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
      - CONFIG_SERVER_URL=http://config-server:8888
      - SERVICE_NAME=logging-service
      - SERVICE_BASE_URL=http://logging-service-2:8000
    depends_on:
      config-server:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  logging-service-3:
    build:
      context: .
      dockerfile: logging/Dockerfile
    environment:
      - LOGGING_INSTANCE_ID=logging-3
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
      - CONFIG_SERVER_URL=http://config-server:8888
      - SERVICE_NAME=logging-service
      - SERVICE_BASE_URL=http://logging-service-3:8000
    depends_on:
      config-server:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started

  hazelcast-1:
    image: hazelcast/hazelcast:5.6.0
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HAZELCAST_CONFIG=config/hazelcast.yaml
    expose:
      - "5701"

  hazelcast-2:
    image: hazelcast/hazelcast:5.6.0
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HAZELCAST_CONFIG=config/hazelcast.yaml
    expose:
      - "5701"

  hazelcast-3:
    image: hazelcast/hazelcast:5.6.0
    volumes:
      - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HAZELCAST_CONFIG=config/hazelcast.yaml
    expose:
      - "5701"

  counter-service:
    build:
      context: .
      dockerfile: counter/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - CONFIG_SERVER_URL=http://config-server:8888
      - SERVICE_NAME=counter-service
      - SERVICE_BASE_URL=http://counter-service:8000
      - HAZELCAST_MEMBERS=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
      - HZ_CLUSTER_NAME=dev
      - HZ_QUEUE_NAME=counter-updates
    depends_on:
      config-server:
        condition: service_started
      hazelcast-1:
        condition: service_started
      hazelcast-2:
        condition: service_started
      hazelcast-3:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
