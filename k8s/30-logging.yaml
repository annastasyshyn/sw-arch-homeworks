apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: lab5
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      serviceAccountName: lab5-sa
      containers:
        - name: logging-service
          image: lab5/logging-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: logging-service
            - name: APP_CONFIGMAP_NAME
              value: microservices-config
            - name: LOGGING_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: lab5
spec:
  selector:
    app: logging-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
