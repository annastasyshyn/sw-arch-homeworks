# ServiceAccount + Role giving every app pod the minimum permissions
# required by k8s_client.py: read ConfigMaps (for "Config Server"
# behaviour) and read Endpoints (for Service Discovery — looking up
# the live pod IPs that back logging-service / counter-service).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab5-sa
  namespace: lab5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab5-reader
  namespace: lab5
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab5-reader-binding
  namespace: lab5
subjects:
  - kind: ServiceAccount
    name: lab5-sa
    namespace: lab5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab5-reader
